<body class="has-fab-gradient">
  <!-- ARIA live region must exist before any toast fires -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="false"></div>

  <a href="#main-content" class="skip-link">Skip to content</a>

  <div class="chapter-glow" aria-hidden="true"></div>

  <!-- 
    CRITICAL: .chapter-page has NO isolation, NO z-index.
    FAB is OUTSIDE .chapter-page so it's never trapped.
    All modals created by ModalManager are appended to <body>.
  -->
  <div class="chapter-page chapter-page-wrapper" id="main-content" tabindex="-1">

    <!-- Sticky Nav -->
    <nav class="chapter-nav" aria-label="Chapter navigation">
      <a href="dashboard.html" class="nav-icon-btn" aria-label="Back to Dashboard">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      </a>

      <div class="chapter-nav__title" id="nav-chapter-name"></div>

      <div class="nav-dropdown-wrapper">
        <button class="nav-icon-btn" id="chapter-menu-btn" aria-label="More options" aria-haspopup="true" aria-expanded="false">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>

        <div id="chapter-nav-dropdown" class="nav-dropdown" role="menu" aria-hidden="true">
          <button class="nav-dropdown__item" role="menuitem" onclick="openSummaryModal()"><svg aria-hidden="true"><use href="icons/sprite.svg#bar-chart-2"></use></svg> Summary</button>
          <button class="nav-dropdown__item" role="menuitem" onclick="openSettlementModal()"><svg aria-hidden="true"><use href="icons/sprite.svg#credit-card"></use></svg> Settle Up</button>
          <button class="nav-dropdown__item" role="menuitem" onclick="downloadReport()"><svg aria-hidden="true"><use href="icons/sprite.svg#download"></use></svg> Export Report</button>
          <div class="nav-dropdown__divider"></div>
          <button class="nav-dropdown__item" role="menuitem" onclick="openMembersPanel()"><svg aria-hidden="true"><use href="icons/sprite.svg#users"></use></svg> Members</button>
        </div>
      </div>
    </nav>

    <!-- Main content -->
    <main class="chapter-main chapter-layout">
      <!-- Tablet Layout Wrappers -->
      <div class="chapter-sidebar">
        <!-- Hero Skeleton -->
        <div id="chapter-hero-skeleton" class="hero-skeleton">
          <div class="skeleton hero-skeleton__icon"></div>
          <div class="skeleton hero-skeleton__title"></div>
          <div class="skeleton hero-skeleton__subtitle" style="width: 20%;"></div>
        </div>

        <!-- Hero Content -->
        <div id="chapter-hero" class="chapter-hero" style="display:none;">
          <div class="chapter-hero__icon" id="chapter-icon"></div>
          <h1 class="chapter-hero__title" id="chapter-title"></h1>
          <p class="chapter-hero__desc" id="chapter-desc"></p>
        </div>

        <!-- Settlements -->
        <section class="settlement-section" aria-label="Settlements">
          <div class="settlement-header" id="hero-settlement-header">
            <div class="settlement-label">
              <div class="settlement-dot" aria-hidden="true"></div>
              Settlements
            </div>
            <div class="settlement-actions">
              <button class="icon-btn-sm" onclick="refreshSettlements(); event.stopPropagation();" aria-label="Refresh">
                <svg width="14" height="14"><use href="icons/sprite.svg#refresh-cw"></use></svg>
              </button>
            </div>
          </div>
          <div class="settlement-body" id="hero-settlement-body">
            <div class="settlement-list" id="hero-settlement-list" role="list"></div>
          </div>
        </section>
      </div>

      <div class="chapter-content">
        <!-- Events strip -->
        <div id="events-strip" class="events-strip" role="tablist" aria-label="Filter by event"></div>

        <!-- Expenses -->
        <section class="expenses-section" aria-label="Expenses">
          <div class="expense-list" id="expense-list" role="list"></div>
          <div id="load-more-container" class="load-more-container"></div>
          <div class="empty-state" id="chapter-empty-state" style="display:none;" role="status">
            <div class="empty-state__icon">
              <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--brand); filter: drop-shadow(var(--brand-glow-sm));"><use href="icons/sprite.svg#credit-card"></use></svg>
            </div>
            <div class="empty-state__title">No expenses yet</div>
            <div class="empty-state__subtitle">Tap the + button to add your first expense</div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!--
    FAB is outside .chapter-page — never inside any stacking context.
    z-index: var(--z-sticky) = 100, which is sufficient since no wrapper has isolation.
  -->
  <!-- Shown only when pending settlements exist -->
  <div class="settle-cta-bar" id="settle-cta-bar" style="display:none" aria-live="polite">
    <button class="settle-cta-btn" onclick="openSettlementModal()" aria-label="Open settle up">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/></svg>
      Settle Up
    </button>
  </div>

  <button class="fab" id="chapter-fab" aria-label="Add new expense">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <!-- Members panel (slide-in drawer) — also outside .chapter-page -->
  <div id="members-panel" class="members-panel" aria-label="Members">
    <div class="members-panel__header">
      <h3 class="members-panel__title">Members</h3>
      <button class="members-panel__close" onclick="closeMembersPanel()" aria-label="Close">×</button>
    </div>
    <div class="members-panel__list" id="members-panel-list" role="list"></div>
    <div class="members-panel__footer" id="member-panel-admin" style="display:none;">
      <button class="btn-add-member" onclick="openAddMemberModal()">+ Add Member</button>
    </div>
  </div>
  <div id="panel-backdrop" class="panel-backdrop"></div>
