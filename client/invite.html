<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter Invite - Hisaab-Kitaab</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50%' y='65%' text-anchor='middle' font-size='80' fill='%237C3AED'>₹</text></svg>">
  
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components/button.css">
  <link rel="stylesheet" href="css/components/toast.css">
  <link rel="stylesheet" href="css/components/card.css">
  <link rel="stylesheet" href="css/pages/login.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="js/core/storage.js" defer></script>
  <script src="js/core/session.js" defer></script>
  <script src="js/api/error-handler.js" defer></script>
  <script src="js/ui/toast.js" defer></script>
  <script src="js/core/sanitize.js" defer></script>
  <script src="js/pages/invite-page.js" defer></script>
</head>
<body class="login-page">
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <div class="login-container" style="max-width: 400px;">
    <div class="login-header">
      <div class="login-logo" style="margin-bottom: 24px;">₹</div>
      <h1 class="login-title" id="invite-title">Loading Invite...</h1>
      <p class="login-subtitle" id="invite-subtitle">Please wait while we fetch the details.</p>
    </div>

    <div class="login-card" id="invite-card" style="display:none; text-align:center;">
      <div style="font-size: 3rem; margin-bottom: 16px;">👥</div>
      <h2 style="font-size: 1.25rem; margin-bottom: 8px; color: var(--text-primary);" id="chapter-name">Chapter Name</h2>
      <p style="color: var(--text-secondary); margin-bottom: 24px; font-size: 0.95rem;">
        Invited by <strong id="inviter-name" style="color: var(--text-primary);">Someone</strong>
      </p>

      <div id="action-buttons" style="display:flex; flex-direction:column; gap:12px;">
        <!-- Injected via JS based on auth state -->
      </div>
    </div>
  </div>
</body>
</html>
