<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Hisaab-Kitaab</title>
  <style>
    body {
      margin: 0; min-height: 100vh; font-family: 'Poppins', sans-serif;
      background: linear-gradient(180deg, #000 0%, #1a0029 100%);
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; color: #fff; text-align: center; padding: 20px;
    }
    .icon { font-size: 4rem; margin-bottom: 20px; }
    h1 { font-size: 1.8rem; margin: 0 0 12px; }
    p { color: rgba(255,255,255,0.7); font-size: 1rem; max-width: 320px; line-height: 1.6; }
    button {
      margin-top: 24px; padding: 14px 32px;
      background: linear-gradient(135deg, #d000ff, #8a2be2);
      border: none; border-radius: 12px; color: #fff;
      font-size: 1rem; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>You're Offline</h1>
  <p>Hisaab-Kitaab needs a connection to sync your expenses. Please check your internet connection.</p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
