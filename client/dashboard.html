  <!-- Redirect Loop Guard -->
  <script>
    (function () {
      var GUARD_KEY = '__dash_redirects';
      var now = Date.now();
      var raw = sessionStorage.getItem(GUARD_KEY);
      var data = raw ? JSON.parse(raw) : { count: 0, time: 0 };

      if (now - data.time < 5000) {
        data.count++;
      } else {
        data.count = 1;
        data.time = now;
      }
      sessionStorage.setItem(GUARD_KEY, JSON.stringify(data));

      if (data.count > 3) {
        var past = 'expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
        document.cookie = 'auth_token=; '     + past + ' SameSite=Lax';
        document.cookie = 'auth_token=; '     + past + ' SameSite=None; Secure';
        document.cookie = 'session_expiry=; ' + past + ' SameSite=Lax';
        document.cookie = 'session_expiry=; ' + past + ' SameSite=None; Secure';
        sessionStorage.removeItem(GUARD_KEY);
        window.location.replace('login.html');
      }
    })();
  </script>

  <!-- Custom Sort Sheet and Speed Dial FAB Menu Toggle handlers -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Custom Sort Dropdown Popover
      const sortTriggerBtn = document.getElementById('btn-sort-sheet');
      const sortSelect = document.getElementById('chapter-sort');
      const sortLabel = document.getElementById('sort-current-label');
      const sortDropdown = document.getElementById('sort-dropdown-menu');
      
      if (sortTriggerBtn && sortSelect && sortLabel && sortDropdown) {
        // Toggle dropdown
        sortTriggerBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const isExpanded = sortDropdown.classList.contains('hidden');
          if (isExpanded) {
            sortDropdown.classList.remove('hidden');
            sortTriggerBtn.setAttribute('aria-expanded', 'true');
          } else {
            sortDropdown.classList.add('hidden');
            sortTriggerBtn.setAttribute('aria-expanded', 'false');
          }
        });

        // Close on outside click
        document.addEventListener('click', (e) => {
          if (!sortDropdown.contains(e.target) && !sortTriggerBtn.contains(e.target)) {
            sortDropdown.classList.add('hidden');
            sortTriggerBtn.setAttribute('aria-expanded', 'false');
          }
        });

        // Handle option selection
        sortDropdown.querySelectorAll('.sort-option').forEach(opt => {
          opt.addEventListener('click', () => {
            const val = opt.dataset.val;
            const text = opt.querySelector('span').textContent;
            
            // Set value & trigger change event
            sortSelect.value = val;
            sortSelect.dispatchEvent(new Event('change', { bubbles: true }));
            
            // Update UI
            sortLabel.textContent = \`Sort: \${text}\`;
            sortDropdown.querySelectorAll('.sort-option').forEach(o => o.classList.remove('selected'));
            opt.classList.add('selected');
            
            // Close dropdown
            sortDropdown.classList.add('hidden');
            sortTriggerBtn.setAttribute('aria-expanded', 'false');
          });
        });
      }

      // 2. Intercept and trigger Speed-dial FAB
      setTimeout(() => {
        const fab = document.getElementById('dashboard-fab');
        const menu = document.getElementById('dashboard-fab-menu');
        
        if (fab && menu) {
          const newFab = fab.cloneNode(true);
          fab.parentNode.replaceChild(newFab, fab);
          
          const toggleMenu = (e) => {
            e.stopPropagation();
            const isActive = menu.classList.toggle('is-active');
            newFab.classList.toggle('is-active', isActive);
            if (typeof window.haptic === 'function') window.haptic('light');
            
            if (isActive) {
              // Focus first interactive element in menu after a short delay for animation
              setTimeout(() => {
                const firstAction = menu.querySelector('a, button, [tabindex]');
                if (firstAction) firstAction.focus();
              }, 50);
            } else {
              // Focus FAB when closed explicitly
              newFab.focus();
            }
          };

          newFab.addEventListener('click', toggleMenu);
          
          document.addEventListener('click', (e) => {
            if (!menu.contains(e.target) && !newFab.contains(e.target)) {
              if (menu.classList.contains('is-active')) {
                menu.classList.remove('is-active');
                newFab.classList.remove('is-active');
                if (typeof window.haptic === 'function') window.haptic('light');
                // Don't forcefully restore focus on outside click, as user clicked elsewhere
              }
            }
          });

          // Close on Escape
          document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && menu.classList.contains('is-active')) {
              menu.classList.remove('is-active');
              newFab.classList.remove('is-active');
              newFab.focus();
            }
          });

          const profileLink = document.getElementById('fab-action-profile');
          if (profileLink) {
            profileLink.addEventListener('click', () => {
              EventBus.emit(EVENTS.PROFILE_MODAL_OPEN, {});
              menu.classList.remove('is-active');
              newFab.classList.remove('is-active');
            });
          }
        }
      }, 500);
    });
  </script>
