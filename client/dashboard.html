<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090B">
  
  <title>Dashboard - Hisaab-Kitaab</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50%' y='65%' text-anchor='middle' font-size='80' fill='%237C3AED'>₹</text></svg>">
  
  <!-- Design System — load order matters -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components/button.css">
  <link rel="stylesheet" href="css/components/card.css">
  <link rel="stylesheet" href="css/components/modal.css">
  <link rel="stylesheet" href="css/components/form.css">
  <link rel="stylesheet" href="css/components/toast.css">
  <link rel="stylesheet" href="css/components/skeleton.css">
  <link rel="stylesheet" href="css/components/fab.css">
  <link rel="stylesheet" href="css/components/avatar.css">
  <link rel="stylesheet" href="css/components/empty-state.css">
  <link rel="stylesheet" href="css/components/badge.css">
  <link rel="stylesheet" href="css/components/command-palette.css">
  
  <link rel="stylesheet" href="css/layout/navbar.css">
  <link rel="stylesheet" href="css/layout/footer.css">
  <link rel="stylesheet" href="css/pages/dashboard.css">
  <link rel="stylesheet" href="css/features.css">
  
  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        as="style"
        onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  </noscript>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hisaab">

  <!-- Splash screens -->
  <link rel="apple-touch-startup-image"
    media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
    href="/icons/splash-390x844.png">

  <!-- Theme Loader — synchronous to prevent FOUC -->
  <script src="js/core/theme-loader.js"></script>
</head>
<body class="has-fab-gradient">
  
  <a href="#main-content" class="skip-link">Skip to content</a>

  <!-- Ambient glow background backdrop -->
  <div class="dashboard-glow" aria-hidden="true"></div>

  <!-- ARIA live region for toasts -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="false"></div>

  <!-- Redirect Loop Guard -->
  <script>
    (function () {
      var GUARD_KEY = '__dash_redirects';
      var now = Date.now();
      var raw = sessionStorage.getItem(GUARD_KEY);
      var data = raw ? JSON.parse(raw) : { count: 0, time: 0 };

      if (now - data.time < 5000) {
        data.count++;
      } else {
        data.count = 1;
        data.time = now;
      }
      sessionStorage.setItem(GUARD_KEY, JSON.stringify(data));

      if (data.count > 3) {
        var past = 'expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
        document.cookie = 'auth_token=; '     + past + ' SameSite=Lax';
        document.cookie = 'auth_token=; '     + past + ' SameSite=None; Secure';
        document.cookie = 'session_expiry=; ' + past + ' SameSite=Lax';
        document.cookie = 'session_expiry=; ' + past + ' SameSite=None; Secure';
        sessionStorage.removeItem(GUARD_KEY);
        window.location.replace('login.html');
      }
    })();
  </script>

  <!-- Main layout container -->
  <main id="main-content" class="dashboard-page-main">

    <!-- Header Navbar -->
    <header class="app-navbar">
      <div class="nav-content">
        <div class="nav-brand">
          <div class="nav-brand-logo" aria-hidden="true">₹</div>
          <h1>Hisaab-Kitaab</h1>
        </div>

        <div class="nav-right">
          <button id="profile-trigger" class="profile-btn" title="My Profile & Friends">
            ?
          </button>
        </div>
      </div>
    </header>

    <div class="dashboard-container">
      
      <!-- Overall summary outstanding balances header widget -->
      <div class="balance-overview-widget" id="balance-overview-box">
        <span class="balance-overview-header">Net Outstanding Balance</span>
        <span class="balance-overview-amount settled">₹0.00</span>
        <span class="balance-overview-desc">Calculating balances across active chapters...</span>
      </div>

      <!-- Toolbar controls layout -->
      <div class="dashboard-controls">
        <!-- Search field with SVG magnifying glass prefix -->
        <div class="search-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="chapter-search" class="search-input" placeholder="Search chapters..." aria-label="Search chapters">
        </div>
        
        <!-- Action filters & custom sorting trigger -->
        <div class="toolbar-actions">
          <button id="btn-sort-sheet" class="btn-filter-chip" aria-label="Sort chapters">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 5h10M11 9h7M11 13h4M3 17l3-3 3 3M6 14v7"/>
            </svg>
            <span id="sort-current-label">Sort: Newest</span>
          </button>
          
          <button id="btn-show-archived" class="btn-filter-chip" aria-label="Show archived chapters">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="21 8 21 21 3 21 3 8"></polyline>
              <rect x="1" y="3" width="22" height="5"></rect>
              <line x1="10" y1="12" x2="14" y2="12"></line>
            </svg>
            <span>Archived</span>
          </button>
        </div>

        <!-- Hidden native select for ChaptersGrid.initToolbar compatibility -->
        <select id="chapter-sort" style="display:none">
          <option value="newest" selected>Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="az">Name (A-Z)</option>
          <option value="members">Members</option>
        </select>
      </div>

      <!-- Grid list -->
      <div class="chapters-grid" id="chapters-grid"></div>

    </div>
  </main>

  <!-- Floating Action Button (FAB) Speed-dial Menu Options -->
  <div class="fab-menu" id="dashboard-fab-menu">
    <button class="fab-menu-item" onclick="EventBus.emit(EVENTS.CHAPTER_MODAL_OPEN, {});" aria-label="Create chapter">
      <span class="fab-menu-item__label">Create Chapter</span>
      <span class="fab-menu-item__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"></path></svg>
      </span>
    </button>
    
    <button class="fab-menu-item" id="fab-action-profile" aria-label="Open profile and friends list">
      <span class="fab-menu-item__label">My Profile & Friends</span>
      <span class="fab-menu-item__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      </span>
    </button>
  </div>

  <!-- Main Speed-Dial FAB -->
  <button class="fab" id="dashboard-fab" aria-label="Open speed dial menu options">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>

  <!-- One-time shared app footer injected by footer.js -->
  <footer id="app-footer" class="app-footer"></footer>

  <!-- Scripts — deferred for faster paint, order preserved by defer -->
  <script src="js/core/storage.js" defer></script>
  <script src="js/core/sanitize.js" defer></script>
  <script src="js/core/csrf.js" defer></script>
  <script src="js/core/session.js" defer></script>
  <script src="js/core/api-cache.js" defer></script>
  <script src="js/core/event-bus.js" defer></script>
  <script src="js/core/modal-manager.js" defer></script>
  <script src="js/api/error-handler.js" defer></script>
  <script src="js/utils/avatar.js" defer></script>
  <script src="js/utils/time.js" defer></script>
  <script src="js/utils/format.js" defer></script>
  <script src="js/ui/toast.js" defer></script>
  <script src="js/ui/command-palette.js" defer></script>
  <script src="js/ui/button.js" defer></script>
  <script src="js/ui/form-validator.js" defer></script>
  <script src="js/pwa/offline-queue.js" defer></script>
  <script src="js/pwa/install-manager.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/features/dashboard/chapters-grid.js" defer></script>
  <script src="js/features/dashboard/chapter-card-menu.js" defer></script>
  <script src="js/features/dashboard/chapter-modal.js" defer></script>
  <script src="js/features/dashboard/profile-modal.js" defer></script>
  <script src="js/features/creator-label.js" defer></script>
  <script src="js/features/personal-chapter.js" defer></script>
  <script src="js/features/categories.js" defer></script>
  <script src="js/shared/footer.js" defer></script>
  <script src="js/pages/dashboard-page.js" defer></script>

  <!-- Custom Sort Sheet and Speed Dial FAB Menu Toggle handlers -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Custom Sort Bottom Sheet
      const sortTriggerBtn = document.getElementById('btn-sort-sheet');
      const sortSelect = document.getElementById('chapter-sort');
      const sortLabel = document.getElementById('sort-current-label');
      
      if (sortTriggerBtn && sortSelect && sortLabel) {
        sortTriggerBtn.addEventListener('click', () => {
          const currentVal = sortSelect.value;
          
          const overlay = ModalManager.createOverlay(`
            <div class="modal-handle"></div>
            <div class="modal-header" style="border-bottom: 1px solid var(--surface-border); padding-bottom: var(--s-3);">
              <h2 class="modal-title" style="font-size: var(--text-base);">Sort Chapters</h2>
            </div>
            <div class="bottom-sheet-menu">
              <button class="bottom-sheet-option ${currentVal === 'newest' ? 'selected' : ''}" data-val="newest">
                <span>Newest first</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </button>
              <button class="bottom-sheet-option ${currentVal === 'oldest' ? 'selected' : ''}" data-val="oldest">
                <span>Oldest first</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </button>
              <button class="bottom-sheet-option ${currentVal === 'az' ? 'selected' : ''}" data-val="az">
                <span>Name (A-Z)</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </button>
              <button class="bottom-sheet-option ${currentVal === 'members' ? 'selected' : ''}" data-val="members">
                <span>Member count</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </button>
            </div>
          `, { type: 'bottom' });

          overlay.querySelectorAll('.bottom-sheet-option').forEach(opt => {
            opt.addEventListener('click', () => {
              const val = opt.dataset.val;
              const text = opt.querySelector('span').textContent;
              
              // Set value & trigger change event
              sortSelect.value = val;
              sortSelect.dispatchEvent(new Event('change', { bubbles: true }));
              
              sortLabel.textContent = `Sort: ${text}`;
              ModalManager.close(overlay);
            });
          });
        });
      }

      // 2. Intercept and trigger Speed-dial FAB
      setTimeout(() => {
        const fab = document.getElementById('dashboard-fab');
        const menu = document.getElementById('dashboard-fab-menu');
        
        if (fab && menu) {
          const newFab = fab.cloneNode(true);
          fab.parentNode.replaceChild(newFab, fab);
          
          const toggleMenu = (e) => {
            e.stopPropagation();
            const isActive = menu.classList.toggle('is-active');
            newFab.classList.toggle('is-active', isActive);
          };

          newFab.addEventListener('click', toggleMenu);
          
          document.addEventListener('click', (e) => {
            if (!menu.contains(e.target) && !newFab.contains(e.target)) {
              menu.classList.remove('is-active');
              newFab.classList.remove('is-active');
            }
          });

          const profileLink = document.getElementById('fab-action-profile');
          if (profileLink) {
            profileLink.addEventListener('click', () => {
              EventBus.emit(EVENTS.PROFILE_MODAL_OPEN, {});
              menu.classList.remove('is-active');
              newFab.classList.remove('is-active');
            });
          }
        }
      }, 500);
    });
  </script>
</body>
</html>
