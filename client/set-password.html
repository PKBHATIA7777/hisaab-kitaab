<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Set Password - Hisaab-Kitaab</title>
  <meta name="description" content="Set password for your Hisaab-Kitaab account.">
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50%' y='65%' text-anchor='middle' font-size='80' fill='%237C3AED' font-family='Arial,sans-serif'>&#8377;</text></svg>">
  
  <!-- Design System — load order matters -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth-pages.css">
  <link rel="stylesheet" href="css/layout/footer.css">
  <link rel="stylesheet" href="css/pages/landing.css">
  <link rel="stylesheet" href="css/pages/auth-flow.css">

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">



  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        as="style"
        onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  </noscript>
  <!-- Theme Loader — synchronous to prevent FOUC -->
  <script src="js/core/theme-loader.js"></script>
  <!-- Social Media Meta Tags -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Hisaab-Kitaab">
  <meta property="og:title" content="Hisaab-Kitaab — Split Expenses, Settle Debts">
  <meta property="og:description" content="Track who paid what and settle group expenses fairly. Hisaab-Kitaab makes splitting bills with friends, flatmates, and family effortless.">
  <meta property="og:image" content="https://hisaab-kitaab.onrender.com/icons/icon-512x512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Hisaab-Kitaab — Split Expenses, Settle Debts">
  <meta name="twitter:description" content="Track who paid what and settle group expenses fairly.">
  <meta name="twitter:image" content="https://hisaab-kitaab.onrender.com/icons/icon-512x512.png">
  
  <!-- Monitoring -->
  <script src="https://browser.sentry-cdn.com/8.5.0/bundle.tracing.replay.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/web-vitals@4/dist/web-vitals.iife.js"></script>
  <script src="js/monitoring.js" defer></script>

</head>
<body class="landing-page">

  <a href="#main-content" class="skip-link">Skip to content</a>

  <!-- Ambient glow -->
  <div class="landing-glow" aria-hidden="true"></div>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="false"></div>

  <!-- App loader -->
  <div id="app-loader" role="status" aria-label="Loading Hisaab-Kitaab">
    <div class="loader-logo" aria-hidden="true">₹</div>
    <div class="loader-spinner" aria-hidden="true"></div>
  </div>

  <main id="main-content" class="landing-main" style="justify-content: center; align-items: center; padding: var(--s-6) 0;">
    <section class="landing-auth-panel" aria-labelledby="auth-card-title" style="width: 100%; max-width: 440px; margin: 0 auto;">
      
      <div class="landing-card auth-card">
        <div class="landing-card-header">
          <!-- Mini brand -->
          <div class="landing-card-mobile-brand" aria-hidden="true">
            <div class="landing-card-mobile-logo">₹</div>
            <span class="landing-card-mobile-name">Hisaab-Kitaab</span>
          </div>
          
          <h2 id="auth-card-title" class="landing-card-title" style="font-size: var(--text-xl); margin: 0;">Set Password</h2>
        </div>

        <div class="landing-card-body">
          <p class="auth-subtitle">Your email is successfully verified. Choose a strong password to secure your account.</p>

          <form id="set-password-form">
            <label style="margin-bottom: var(--s-3);">
              New Password
              <div class="password-wrapper">
                <input type="password" name="newPassword" id="input-new-password" required autocomplete="new-password" placeholder="••••••••">
                <button type="button" class="btn-toggle-pass" tabindex="-1" aria-label="Toggle password visibility">
                  <svg viewBox="0 0 24 24">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </label>

            <!-- Real-time Password Strength Meter -->
            <div class="pwd-strength-container">
              <div class="pwd-strength-bar-track">
                <div class="pwd-strength-bar-fill"></div>
              </div>
              <span class="pwd-strength-label"></span>
            </div>

            <p class="password-hint" style="font-size: var(--text-xs); color: var(--text-muted); margin-bottom: var(--s-4);">Password must be at least 8 characters</p>

            <label style="margin-bottom: var(--s-5);">
              Confirm Password
              <div class="password-wrapper">
                <input type="password" name="confirmPassword" required autocomplete="new-password" placeholder="••••••••">
                <button type="button" class="btn-toggle-pass" tabindex="-1" aria-label="Toggle password visibility">
                  <svg viewBox="0 0 24 24">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </label>

            <button type="submit" class="btn-primary">Save Password</button>
          </form>

          <p class="auth-fine-print">
            Remembered password? <a href="login.html">Back to login</a>
          </p>
        </div>
      </div>

    </section>
  </main>

  <!-- Shared core scripts -->
  <script src="js/core/storage.js"></script>
  <script src="js/core/sanitize.js"></script>
  <script src="js/core/csrf.js"></script>
  <script src="js/core/session.js"></script>
  <script src="js/core/api-cache.js"></script>
  <script src="js/main.js"></script>
  <script src="js/pages/set-password-page.js"></script>

  <!-- Real-time password strength meter script -->
  <script>
    document.addEventListener('input', (e) => {
      if (e.target.type === 'password' && e.target.id === 'input-new-password') {
        const pwd = e.target.value;
        const bar = document.querySelector('.pwd-strength-bar-fill');
        const label = document.querySelector('.pwd-strength-label');
        if (!bar || !label) return;

        if (!pwd) {
          bar.className = 'pwd-strength-bar-fill';
          label.textContent = '';
          return;
        }

        let score = 0;
        if (pwd.length >= 8) score++;
        if (/[A-Z]/.test(pwd)) score++;
        if (/[0-9]/.test(pwd)) score++;
        if (/[^A-Za-z0-9]/.test(pwd)) score++;

        if (pwd.length < 8) {
          bar.className = 'pwd-strength-bar-fill weak';
          label.textContent = 'Too short';
          label.style.color = 'var(--negative)';
        } else if (score < 3) {
          bar.className = 'pwd-strength-bar-fill medium';
          label.textContent = 'Medium strength';
          label.style.color = 'var(--warning)';
        } else {
          bar.className = 'pwd-strength-bar-fill strong';
          label.textContent = 'Strong password';
          label.style.color = 'var(--positive)';
        }
      }
    });
  </script>
</body>
</html>
