<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Set password - Hisaab-Kitaab</title>
  <link rel="icon" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
  <text x='50%' y='65%' text-anchor='middle'
        font-size='80'
        fill='%23d000ff'
        font-family='Arial, sans-serif'>₹</text>
</svg>">

  <link rel="stylesheet" href="css/base.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>

  <div class="bubble-container">
    <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
    <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
  </div>

  <div class="brand-header">
    <h1>Hisaab-Kitaab</h1>
    <p>Your way of handling expenses</p>
  </div>

  <main id="main-content">
    <div class="auth-wrapper">
      <section class="auth-card">
        <h1 class="auth-title">Set your password</h1>
        <p class="auth-subtitle">
          Your email is verified. Choose a strong password for your account.
        </p>

        <form id="set-password-form">
          <label>New password
            <div class="password-wrapper">
              <input type="password" name="newPassword" required autocomplete="new-password" placeholder="••••••••">
              <button type="button" class="btn-toggle-pass" tabindex="-1" aria-label="Toggle password visibility">👁️</button>
            </div>
            <small class="password-hint">Password must be at least 8 characters</small>
          </label>

          <label>Confirm password
            <div class="password-wrapper">
              <input type="password" name="confirmPassword" required autocomplete="new-password" placeholder="••••••••">
              <button type="button" class="btn-toggle-pass" tabindex="-1" aria-label="Toggle password visibility">👁️</button>
            </div>
          </label>

          <button type="submit" class="btn-primary">Save password</button>
        </form>

        <p style="margin-top:20px; font-size:0.9rem; color:#666;">
          Already set it? <a href="login.html">Log in</a>
        </p>
      </section>
    </div>
  </main>



  <!-- ADD THIS as the first script in every HTML file, before any other scripts -->
<script src="js/core/storage.js"></script>
  <script src="js/core/sanitize.js"></script>
  <script src="js/core/csrf.js"></script>
  <script src="js/core/session.js"></script>
  <script src="js/core/api-cache.js"></script>
  <script src="js/main.js"></script>
  <!-- In login.html, REPLACE the large inline <script> block with: -->
<script src="js/pages/set-password-page.js"></script>
  
</body>
</html>
