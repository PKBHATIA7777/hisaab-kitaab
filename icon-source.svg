<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C27B0" />
      <stop offset="50%" stop-color="#673AB7" />
      <stop offset="100%" stop-color="#1A237E" />
    </linearGradient>
    <!-- Icon Glow/Gradient -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E040FB" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Styled Ledger/Wallet Icon with HK initials -->
  <g transform="translate(112, 112)" filter="url(#glow)">
    <!-- Main Book/Ledger Shape -->
    <rect x="20" y="20" width="220" height="250" rx="20" fill="none" stroke="url(#iconGrad)" stroke-width="24" stroke-linejoin="round" />
    <!-- Book Spine/Ribs -->
    <line x1="20" y1="70" x2="60" y2="70" stroke="url(#iconGrad)" stroke-width="24" stroke-linecap="round" />
    <line x1="20" y1="140" x2="60" y2="140" stroke="url(#iconGrad)" stroke-width="24" stroke-linecap="round" />
    <line x1="20" y1="210" x2="60" y2="210" stroke="url(#iconGrad)" stroke-width="24" stroke-linecap="round" />
    
    <!-- Stylized H and K intersecting in the middle -->
    <!-- Left vertical bar of H -->
    <line x1="100" y1="90" x2="100" y2="200" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" />
    <!-- Right vertical bar of H & spine of K -->
    <line x1="145" y1="90" x2="145" y2="200" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" />
    <!-- Crossbar of H -->
    <line x1="100" y1="145" x2="145" y2="145" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" />
    
    <!-- Diagonal legs of K -->
    <line x1="145" y1="145" x2="190" y2="100" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" />
    <line x1="145" y1="145" x2="190" y2="190" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" />
  </g>
</svg>
